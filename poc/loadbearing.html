<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Loadbearing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: header with three modes; each mode = left rail · center work area · right panel. */
:root {
  --bg: #F5F5F2; --surface: #FFFFFF; --surface-2: #FAFAF7; --sunk: #EFEFEA;
  --line: #E3E3DC; --line-2: #D3D3CB; --ink: #1B1C20; --ink-2: #41444B; --muted: #5F626B;
  --accent: #3F4FD8; --accent-hover: #2F3DB8; --accent-ink: #2B379E; --accent-soft: #ECEEFF; --accent-line: #B9BDF0; --on-accent: #FFFFFF;
  --good: #17784E; --good-soft: #E2F4EA; --warn: #8A5A00; --warn-soft: #FFF2D9; --bad: #B4362C; --bad-soft: #FDEBE8;
  --wl: #3F4FD8; --wl-soft: #ECEEFF; --data: #A86400; --data-soft: #FFF1D9; --msg: #17784E; --msg-soft: #E2F4EA; --file: #B4235A; --file-soft: #FCE7EE; --ext: #5F626B; --ext-soft: #EFEFEA;
  --read: #2F6FE0; --write: #C2410C; --pub: #17784E; --repl: #8A4FD8;
  --dot: #E0E0D8; --land: #DCDCD3; --shadow: 0 1px 2px rgba(20,20,30,.06); --shadow-lg: 0 16px 48px rgba(20,20,40,.18); --scrim: rgba(27,28,32,.32);
  --code-bg: #FBFBF8; --tk-k: #3F4FD8; --tk-w: #9A3412; --tk-h: #9A3412; --tk-d: #0F766E; --tk-n: #A21CAF; --tk-s: #15803D; --tk-c: #8A8D95; --tk-err: rgba(180,54,44,.12);
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121317; --surface: #1A1C21; --surface-2: #1E2026; --sunk: #24272E; --line: #2C2F37; --line-2: #3A3E48; --ink: #ECEDF1; --ink-2: #C5C8D0; --muted: #9EA2AC;
  --accent: #8A95FF; --accent-hover: #A6AEFF; --accent-ink: #C3C9FF; --accent-soft: #252A4C; --accent-line: #4A5199; --on-accent: #10121A;
  --good: #5CC892; --good-soft: #17301F; --warn: #E6B450; --warn-soft: #33270F; --bad: #FF8A7E; --bad-soft: #3A1B18;
  --wl: #8A95FF; --wl-soft: #252A4C; --data: #E6B450; --data-soft: #33270F; --msg: #5CC892; --msg-soft: #17301F; --file: #F27FA6; --file-soft: #3A1826; --ext: #A9ADB7; --ext-soft: #2A2D34;
  --read: #6FA0FF; --write: #FB8A5C; --pub: #5CC892; --repl: #B892FF;
  --dot: #2A2D35; --land: #2E323B; --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 16px 48px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.5);
  --code-bg: #16181C; --tk-k: #9AA4FF; --tk-w: #FDBA74; --tk-h: #FDBA74; --tk-d: #5EEAD4; --tk-n: #F0ABFC; --tk-s: #86EFAC; --tk-c: #7D818B; --tk-err: rgba(255,138,126,.16); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121317; --surface: #1A1C21; --surface-2: #1E2026; --sunk: #24272E; --line: #2C2F37; --line-2: #3A3E48; --ink: #ECEDF1; --ink-2: #C5C8D0; --muted: #9EA2AC;
  --accent: #8A95FF; --accent-hover: #A6AEFF; --accent-ink: #C3C9FF; --accent-soft: #252A4C; --accent-line: #4A5199; --on-accent: #10121A;
  --good: #5CC892; --good-soft: #17301F; --warn: #E6B450; --warn-soft: #33270F; --bad: #FF8A7E; --bad-soft: #3A1B18;
  --wl: #8A95FF; --wl-soft: #252A4C; --data: #E6B450; --data-soft: #33270F; --msg: #5CC892; --msg-soft: #17301F; --file: #F27FA6; --file-soft: #3A1826; --ext: #A9ADB7; --ext-soft: #2A2D34;
  --read: #6FA0FF; --write: #FB8A5C; --pub: #5CC892; --repl: #B892FF;
  --dot: #2A2D35; --land: #2E323B; --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 16px 48px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.5);
  --code-bg: #16181C; --tk-k: #9AA4FF; --tk-w: #FDBA74; --tk-h: #FDBA74; --tk-d: #5EEAD4; --tk-n: #F0ABFC; --tk-s: #86EFAC; --tk-c: #7D818B; --tk-err: rgba(255,138,126,.16); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.sr { position: absolute; left: -9999px; }

/* header */
.top { flex: none; z-index: 40; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; }
.brand b { font-size: 15px; font-weight: 600; }
.docs { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.docbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; max-width: 260px; min-height: 30px; }
.docbtn:hover { border-color: var(--muted); }
.docbtn .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.docbtn .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.modes { display: flex; align-items: center; gap: 4px; margin: 0 auto; }
.mode { display: flex; align-items: center; gap: 9px; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 5px 12px 5px 6px; text-align: left; min-height: 42px; }
.mode:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line); }
.mode.on { background: var(--accent-soft); border-color: var(--accent-line); }
.mode:disabled { cursor: not-allowed; opacity: .55; }
.mode .n { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; background: var(--sunk); color: var(--ink-2); flex-shrink: 0; }
.mode.on .n { background: var(--accent); color: var(--on-accent); }
.mode .t { display: block; font-weight: 600; line-height: 1.1; }
.mode .s { display: block; font-size: 11.5px; line-height: 1.2; margin-top: 2px; }
.mode .s.ok { color: var(--good); } .mode .s.bad { color: var(--bad); } .mode .s.warn { color: var(--warn); } .mode .s.off { color: var(--muted); }
.arrow { color: var(--line-2); }
.tright { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 7px 13px; border-radius: 8px; border: 0; min-height: 34px; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--accent-hover); } .btn:disabled { opacity: .5; cursor: default; }
.ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); color: var(--ink); padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line-2); min-height: 34px; text-decoration: none; white-space: nowrap; }
.ghost:hover { background: var(--surface-2); border-color: var(--muted); }
.ghost.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
.sm { min-height: 28px !important; padding: 3px 9px !important; font-size: 12.5px; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink-2); flex-shrink: 0; }
.iconbtn:hover { background: var(--sunk); } .iconbtn:disabled { opacity: .35; cursor: default; background: transparent; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; text-align: left; }
.link:hover { text-decoration: underline; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { background: var(--surface); border: 1px solid var(--line-2); color: var(--ink-2); font-size: 12.5px; padding: 4px 10px; border-radius: 8px; min-height: 30px; }
.seg button:hover { border-color: var(--muted); }
.seg button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.tabs2 { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; }
.tabs2 button { background: transparent; border: 0; padding: 4px 12px; border-radius: 7px; color: var(--ink-2); font-weight: 500; min-height: 28px; }
.tabs2 button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tag { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.tag.auto { background: var(--accent-soft); color: var(--accent-ink); } .tag.good { background: var(--good-soft); color: var(--good); } .tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.mute { background: var(--sunk); color: var(--ink-2); }
input.field, select.field { background: var(--surface); border: 1px solid var(--line-2); border-radius: 7px; padding: 4px 8px; min-height: 30px; min-width: 0; }
input.field:focus, select.field:focus { border-color: var(--accent); outline: none; }
input.num { text-align: right; font-family: var(--mono); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line-2); position: relative; margin: 0; cursor: pointer; transition: background .15s; flex-shrink: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch input:checked { background: var(--accent); } .switch input:checked::after { left: 16px; }
.rdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

/* three-pane layout */
#view { flex: 1; min-height: 0; }
.panes { display: flex; height: 100%; min-height: 0; }
.rail { flex: 0 0 236px; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 12px 24px; padding-left: max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.center { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.center.scroll { overflow-y: auto; }
.panel { flex: 0 0 420px; background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 18px 28px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ctool { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.rsec { display: flex; flex-direction: column; gap: 4px; }
.rsec .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.ritem { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 5px 7px; text-align: left; min-height: 32px; }
.ritem:hover { background: var(--surface-2); }
.ritem.on { background: var(--accent-soft); border-color: var(--accent-line); }
.ritem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ico { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* canvas */
.cwrap { position: relative; flex: 1; min-height: 0; overflow: auto; background-color: var(--surface-2); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; }
.canvas { position: relative; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.bn { position: absolute; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); cursor: grab; user-select: none; touch-action: none; overflow: hidden; }
.bn:hover { border-color: var(--muted); }
.bn.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.bn.err { border-color: var(--bad); }
.bn.drag { cursor: grabbing; box-shadow: var(--shadow-lg); z-index: 5; }
.bn .hd { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 38px; border-bottom: 1px solid var(--line); }
.bn .hd b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.bn .row { display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 12px; font-family: var(--mono); white-space: nowrap; overflow: hidden; }
.bn .row .t { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.bn.ext { border-style: dashed; }
.etag { font-family: var(--font); font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px; }
.probs { flex: none; max-height: 34%; overflow-y: auto; border-top: 1px solid var(--line); background: var(--surface); padding: 8px 14px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
.prob { display: flex; gap: 10px; align-items: flex-start; padding: 5px 4px; border-radius: 6px; width: 100%; background: transparent; border: 0; text-align: left; }
.prob:hover { background: var(--surface-2); }
.prob .ic { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; margin-top: 1px; }
.prob .ic.error { background: var(--bad-soft); color: var(--bad); } .prob .ic.warn { background: var(--warn-soft); color: var(--warn); }

/* code editor */
.editor { display: flex; border: 1px solid var(--line-2); border-radius: 10px; background: var(--code-bg); overflow: visible; font-family: var(--mono); font-size: 12.5px; line-height: 20px; }
.editor:focus-within { border-color: var(--accent); }
.gutter { border-radius: 10px 0 0 10px; flex: none; padding: 10px 8px 10px 10px; color: var(--muted); text-align: right; user-select: none; border-right: 1px solid var(--line); min-width: 36px; white-space: pre; }
.gutter .e { color: var(--bad); font-weight: 600; }
.code-area { position: relative; flex: 1; min-width: 0; }
.code-area pre, .code-area textarea { margin: 0; padding: 10px 12px; font: inherit; line-height: 20px; white-space: pre; tab-size: 2; letter-spacing: 0; }
.code-area pre { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--ink); }
.code-area textarea { position: relative; display: block; width: 100%; border: 0; outline: none; resize: none; background: transparent; color: transparent; caret-color: var(--ink); overflow-x: auto; overflow-y: hidden; min-height: 200px; }
.code-area textarea::selection { background: var(--accent-soft); color: transparent; }
.tk-k { color: var(--tk-k); font-weight: 600; } .tk-w { color: var(--tk-w); } .tk-h { color: var(--tk-h); font-weight: 500; } .tk-d { color: var(--tk-d); } .tk-n { color: var(--tk-n); } .tk-s { color: var(--tk-s); } .tk-c { color: var(--tk-c); font-style: italic; }
.tk-err { background: var(--tk-err); border-radius: 2px; text-decoration: underline wavy var(--bad); text-underline-offset: 3px; }
.snips { display: flex; flex-wrap: wrap; gap: 4px; }
.snips button { font-family: var(--mono); font-size: 11.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; color: var(--tk-k); min-height: 26px; }
.snips button:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.ref { font-size: 12.5px; color: var(--ink-2); }
.ref code { font-family: var(--mono); font-size: 12px; background: var(--sunk); padding: 1px 4px; border-radius: 4px; color: var(--ink); }
.ref table { border-collapse: collapse; width: 100%; } .ref td { padding: 4px 0; border-top: 1px solid var(--line); vertical-align: top; } .ref td:first-child { width: 48%; padding-right: 8px; }
details > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 6px; }
details > summary::-webkit-details-marker { display: none; }

/* panel bits */
.ph { display: flex; align-items: center; gap: 10px; }
.ph input { font-size: 17px; font-weight: 600; border: 1px solid transparent; border-radius: 6px; background: transparent; padding: 2px 4px; width: 100%; min-width: 0; }
.ph input:hover { border-color: var(--line); } .ph input:focus { border-color: var(--accent); outline: none; }
.q { display: flex; flex-direction: column; gap: 6px; }
.q .qh { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.note { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.ftbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ftbl th { text-align: left; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ftbl td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
.ftbl input.field, .ftbl select.field { width: 100%; min-height: 28px; padding: 2px 6px; font-size: 12.5px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; font-family: var(--mono); }
.maplist label { display: flex; align-items: center; gap: 8px; padding: 4px 2px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.maplist label.dis { color: var(--muted); }

/* deploy diagram + map */
.dview { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--surface-2); }
.dg { position: relative; }
.rcol { position: absolute; z-index: 0; border: 1px dashed var(--line-2); border-radius: 14px; background: var(--surface); }
.rcol .rh { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; font-weight: 600; }
.ib { position: absolute; z-index: 2; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); cursor: pointer; text-align: left; }
.ib:hover { border-color: var(--muted); }
.ib.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ib .hd { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 12.5px; margin-bottom: 5px; }
.ib .hd span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.ib .heat { position: absolute; top: 8px; right: 8px; font-family: var(--mono); font-size: 10.5px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.map { width: 100%; height: auto; display: block; }
.map .land circle { fill: var(--land); }
.map text { font-family: var(--font); font-size: 11px; fill: var(--ink-2); }
.map .rg { cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); padding: 8px 14px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }


/* infra board */
.board { position: relative; padding: 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.band { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 12px; border: 1px dashed var(--line-2); border-radius: 12px; background: var(--surface); }
.regions { display: flex; flex-wrap: nowrap; gap: 30px 48px; align-items: flex-start; }
.regions > .region { flex: 1 0 380px; }
.regions > .region.outside { flex: 0 0 220px; }
.board.wrap .regions { flex-wrap: wrap; }
.board { width: max-content; min-width: 100%; }
.board.wrap { width: auto; }
.region { position: relative; border: 1.5px solid var(--line-2); border-radius: 16px; background: var(--surface); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.region.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.region.outside { border-style: dotted; background: transparent; }

<script>
/* ===================== Workload language =====================
   when <Trigger> { ... }
     Trigger: Name | message Data | file Data | schedule "text" | change Data
   Statements:
     call Workload.Handler
     read|insert|update|upsert|delete Data [by field|where field] [many N]
     publish Data
     if Condition [@12%] { ... } [else { ... }]
     for each item in Source [~N] [parallel N] { ... }      (Source "file" = rows of the file)
     parallel { ... }
     compute 15ms
     error [code]
     return
*/
const DATA_KINDS = {
  table: { label: 'Table', ops: ['read', 'insert', 'update', 'upsert', 'delete'], soft: { publish: 'Publishing to a table works as an “outbox” that something else polls. A stream or queue is the usual choice.' } },
  document: { label: 'Documents', ops: ['read', 'insert', 'update', 'upsert', 'delete'], soft: { publish: 'Publishing to a collection works as an outbox. A stream or queue is the usual choice.' } },
  kv: { label: 'Key-value', ops: ['read', 'insert', 'update', 'upsert', 'delete'], soft: { publish: 'Publishing to a key-value store works as an outbox. A stream or queue is the usual choice.' } },
  queue: { label: 'Queue', ops: ['publish', 'insert'], trigger: 'message', soft: { read: 'Reading a queue directly takes messages off it. Usually a “when message” handler processes them.', delete: 'Deleting from a queue acknowledges a message. Usually handled for you.' } },
  stream: { label: 'Event stream', ops: ['publish', 'insert'], trigger: 'message', soft: { read: 'Reading a stream directly replays events. Usually a “when message” handler consumes them.' } },
  topic: { label: 'Pub/sub topic', ops: ['publish', 'insert'], trigger: 'message', soft: {} },
  file: { label: 'Files', ops: ['read', 'insert', 'delete'], trigger: 'file', soft: { update: 'Files are written whole, so this rewrites the file.', upsert: 'Files are written whole, so this rewrites the file.' } },
  blob: { label: 'Objects', ops: ['read', 'insert', 'delete', 'upsert'], soft: { update: 'Objects are written whole, so this rewrites the object.' } }
};
const KW = ['when', 'call', 'read', 'insert', 'update', 'upsert', 'delete', 'publish', 'if', 'else', 'for', 'each', 'in', 'parallel', 'compute', 'error', 'return', 'by', 'where', 'many', 'message', 'file', 'schedule', 'change'];

function parseCode(src) {
  const lines = String(src || '').split('\n');
  const handlers = [], errors = [];
  const stack = []; // frames: {type, node, body}
  const push = st => { if (!stack.length) { errors.push({ line: st.line, msg: 'Statements must be inside a “when … { }” block.' }); return false; } stack[stack.length - 1].body.push(st); return true; };
  for (let i = 0; i < lines.length; i++) {
    const ln = i + 1;
    let line = lines[i].replace(/(#|\/\/).*$/, '').trim();
    if (!line) continue;
    // closing braces, possibly followed by else
    while (line.startsWith('}')) {
      line = line.slice(1).trim();
      if (!stack.length) { errors.push({ line: ln, msg: 'There’s an extra “}”.' }); continue; }
      const top = stack.pop();
      if (/^else\b/i.test(line)) {
        if (top.type !== 'if') { errors.push({ line: ln, msg: '“else” must follow an “if” block.' }); line = ''; break; }
        let rest = line.replace(/^else\s*/i, '');
        if (rest === '{') { top.node.else = []; stack.push({ type: 'else', node: top.node, body: top.node.else }); line = ''; }
        else if (/^if\b/i.test(rest)) { top.node.else = []; const st = parseIf(rest, ln, errors); if (st) { top.node.else.push(st); stack.push({ type: 'if', node: st, body: st.then }); } line = ''; }
        else { errors.push({ line: ln, msg: 'Write “} else {” or “} else if Condition {”.' }); line = ''; }
      }
    }
    if (!line) continue;
    let m;
    if ((m = line.match(/^when\s+(.+?)\s*\{$/i))) {
      if (stack.length) { errors.push({ line: ln, msg: '“when” blocks can’t be nested. Close the previous block first.' }); continue; }
      const spec = m[1].trim(); let trig;
      let mm;
      if ((mm = spec.match(/^(message|event)\s+([A-Za-z_][\w]*)$/i))) trig = { type: 'message', data: mm[2], name: 'message ' + mm[2] };
      else if ((mm = spec.match(/^file\s+([A-Za-z_][\w]*)$/i))) trig = { type: 'file', data: mm[1], name: 'file ' + mm[1] };
      else if ((mm = spec.match(/^change\s+([A-Za-z_][\w]*)$/i))) trig = { type: 'change', data: mm[1], name: 'change ' + mm[1] };
      else if ((mm = spec.match(/^schedule\s+"?([^"]+)"?$/i))) trig = { type: 'schedule', text: mm[1], name: 'schedule ' + mm[1] };
      else if ((mm = spec.match(/^([A-Za-z_][\w]*)$/))) trig = { type: 'call', name: mm[1] };
      else { errors.push({ line: ln, msg: `Don’t understand the trigger “${spec}”. Use a name, “message Data”, “file Data”, “change Data” or “schedule "daily 02:00"”.` }); trig = { type: 'call', name: 'Unnamed' + ln }; }
      const h = Object.assign({ line: ln, body: [] }, trig);
      handlers.push(h); stack.push({ type: 'when', node: h, body: h.body });
      continue;
    }
    if (/^if\b/i.test(line)) { const st = parseIf(line, ln, errors); if (st && push(st)) stack.push({ type: 'if', node: st, body: st.then }); continue; }
    if ((m = line.match(/^for\s+each\s+(\w+)\s+in\s+(\w+)(.*)\{$/i))) {
      const rest = m[3]; const n = (rest.match(/~\s*([\d_,.]+[kKmM]?)/) || [])[1]; const par = (rest.match(/parallel\s+(\d+)/i) || [])[1];
      const st = { t: 'loop', line: ln, item: m[1], src: m[2], n: n ? num(n) : null, par: par ? +par : 1, body: [] };
      if (push(st)) stack.push({ type: 'loop', node: st, body: st.body }); continue;
    }
    if (/^parallel\s*\{$/i.test(line)) { const st = { t: 'par', line: ln, body: [] }; if (push(st)) stack.push({ type: 'par', node: st, body: st.body }); continue; }

      <div class="q maplist" data-fb="Data in this store"><div class="qh">Data stored here</div>${ST.build.data.map(d => { const F = storeFit(st.type, d.kind); const ok = F.fit !== 'no'; const on = st.data.includes(d.name); const other = !on && Dp.stores.find(x => x.data.includes(d.name)); return `<label class="${ok || on ? '' : 'dis'}" ${F.note ? `title="${esc(F.note)}"` : ''}><input type="checkbox" ${on ? 'checked' : ''} ${ok || on ? '' : 'disabled'} data-ch="d-mapd" data-id="${st.id}" data-d="${esc(d.name)}"><span style="flex:1" class="mono">${esc(d.name)}</span><span class="muted">${!ok ? `can’t hold ${DATA_KINDS[d.kind].label.toLowerCase()}` : other ? 'in ' + esc(other.name) : DATA_KINDS[d.kind].label.toLowerCase()}</span>${F.fit === 'works' ? '<span class="tag warn">works</span>' : ''}</label>`; }).join('')}<div class="note">Many data nodes can share one store, like several tables in one database. “Works” means it fits but isn’t what this product is best at; hover for why.</div></div>`;
    return;
  }
  if (s.t === 'net') {
    const N = Dp.network;
    el.innerHTML = head(IC.route, 'var(--accent-soft)', 'var(--accent)', 'Network', 'Global network', 'net', null, null) +
      `<div class="q"><div class="qh">Sending users to a region</div><div class="seg">${Object.keys(NET.steering).map(k => `<button type="button" class="${N.steering === k ? 'on' : ''}" data-act="d-net" data-k="steering" data-v="${k}">${NET.steering[k].label}</button>`).join('')}</div><div class="note">${NET.steering[N.steering].note}</div></div>
      <div class="q"><label class="switch"><input type="checkbox" ${Dp.peering ? 'checked' : ''} data-ch="d-peer"><span>Connect region networks</span></label>${Dp.peering ? `<div class="seg">${Object.keys(NET.link).map(k => `<button type="button" class="${N.link === k ? 'on' : ''}" data-act="d-net" data-k="link" data-v="${k}">${NET.link[k].label}</button>`).join('')}</div><div class="note">${NET.link[N.link].note}</div>` : '<div class="note">Private services in one region can’t reach private services in another.</div>'}</div>
      <div class="q"><div class="qh">Each region</div>${sortedRegions().map(r => { const NR = netRegion(Dp, r); return `<button type="button" class="ritem" data-act="d-sel" data-t="r" data-id="${r}"><span class="mono" style="width:90px">${REGIONS[r].code}</span><span class="nm muted" style="font-size:12px">${NET.entry[NR.entry].label}${NR.nat ? ' · NAT' : ''}${NR.endpoints ? ' · endpoints' : ''}</span></button>`; }).join('')}</div>`;
    return;
  }
  if (s.t === 'r') {
    const r = s.id; const others = Dp.regions.filter(x => x !== r);
    el.innerHTML = head(IC.globe, 'var(--accent-soft)', 'var(--accent)', 'Region', `${REGIONS[r].code} · ${REGIONS[r].city}`, r, null, null) +
      `<div class="q" data-fb="Region entry"><div class="qh">How users get in</div><div class="seg">${Object.keys(NET.entry).map(k => `<button type="button" class="${netRegion(Dp, r).entry === k ? 'on' : ''}" data-act="d-rnet" data-r="${r}" data-k="entry" data-v="${k}">${NET.entry[k].label}</button>`).join('')}</div><div class="note">${NET.entry[netRegion(Dp, r).entry].note} Functions and scale-to-zero containers have their own public address, so they don’t need one.</div>
        ${netRegion(Dp, r).entry === 'apigw' ? `<label style="display:flex;gap:6px;align-items:center"><span class="muted">Request limit</span><input class="field num" style="width:100px" type="number" min="1" id="r-limit" value="${netRegion(Dp, r).limit}" data-ch="d-rlimit" data-r="${r}"><span class="muted">per second</span></label>` : ''}</div>
      <div class="q" data-fb="Region egress"><div class="qh">Leaving the private network</div>
        <label class="switch"><input type="checkbox" ${netRegion(Dp, r).nat ? 'checked' : ''} data-ch="d-rnetb" data-r="${r}" data-k="nat"><span>NAT gateway</span></label><div class="note">${NET.nat.note} Needed to call outside services.</div>
        <label class="switch"><input type="checkbox" ${netRegion(Dp, r).endpoints ? 'checked' : ''} data-ch="d-rnetb" data-r="${r}" data-k="endpoints"><span>Private endpoints</span></label><div class="note">${NET.endpoints.note} Faster than going through NAT.</div></div>
      <div class="q"><div class="qh">Running here</div><div class="chips">${Dp.compute.filter(c => c.regions.includes(r)).map(c => `<span class="chip">${esc(c.name)}</span>`).join('') || '<span class="muted">No compute</span>'}${Dp.stores.filter(x => x.regions.includes(r)).map(x => `<span class="chip">${esc(x.name)} ${storeRole(x, r) ? '· ' + storeRole(x, r) : ''}</span>`).join('')}</div></div>
      <div class="q"><div class="qh">Round trip to other regions</div>${others.length ? others.map(o => `<div class="kv"><span class="mono">${REGIONS[o].code}</span><span class="num">${rtt(r, o)} ms</span></div>`).join('') : '<div class="muted">Only region.</div>'}<div class="note">Estimated from distance (light in fiber plus routing). Real figures vary.</div></div>
      <div class="q"><div class="qh">Users nearby</div>${Object.keys(POPS).map(p => `<div class="kv"><span>${POPS[p].label}</span><span class="num">${popRtt(p, r)} ms</span></div>`).join('')}</div>
      <div><button type="button" class="ghost sm" data-act="d-rmregion" data-id="${r}">Stop using ${REGIONS[r].code}</button></div>`;
    return;
  }
  if (s.t === 'x') {
    const e = (Dp.externals && Dp.externals[s.id]) || { region: 'use1' };
    el.innerHTML = head(IC.ext, 'var(--ext-soft)', 'var(--ext)', 'Outside service', s.id, s.id, null, null) + `<div class="q"><label class="qh" for="x-reg">Hosted near</label><select class="field" id="x-reg" data-ch="d-xreg" data-id="${esc(s.id)}">${Object.keys(REGIONS).map(r => `<option value="${r}" ${e.region === r ? 'selected' : ''}>${REGIONS[r].code} · ${REGIONS[r].city}</option>`).join('')}</select><div class="note">You don’t run it, so there’s nothing to size. Its response time comes from the Build code; the distance to it comes from here.</div></div>`;
    return;
  }
  if (s.t === 'wl' || s.t === 'dn') {
    const isW = s.t === 'wl'; const opts = isW ? Dp.compute : Dp.stores.filter(x => storeFit(x.type, A.D[s.id].kind).fit !== 'no');
    el.innerHTML = head(isW ? IC.code : KIND_STYLE[A.D[s.id].kind][2], isW ? 'var(--wl-soft)' : 'var(--data-soft)', isW ? 'var(--wl)' : 'var(--data)', isW ? 'Workload' : 'Data · ' + DATA_KINDS[A.D[s.id].kind].label, s.id, s.id, null, null) +
      `<div class="q"><div class="qh">${isW ? 'Where does it run?' : 'Where is it stored?'}</div>${opts.length ? opts.map(o => `<button type="button" class="ritem" data-act="d-place" data-t="${s.t}" data-id="${esc(s.id)}" data-to="${o.id}">${svg(isW ? CICON[o.type] : SICON[o.type], 14, isW ? 'var(--wl)' : 'var(--data)')}<span class="nm">${esc(o.name)}</span><span class="muted" style="font-size:12px">${isW ? COMPUTE[o.type].short : STORES[o.type].label}</span></button>`).join('') : '<div class="muted">Nothing suitable yet.</div>'}
      <div class="lbl" style="margin-top:8px">Or create new</div>${isW ? Object.keys(COMPUTE).map(k => `<button type="button" class="ritem" data-act="d-place-new" data-t="wl" data-id="${esc(s.id)}" data-type="${k}">${svg(CICON[k], 14, 'var(--wl)')}<span class="nm">New ${COMPUTE[k].label.toLowerCase()}</span></button>`).join('') : Object.keys(STORES).filter(k => storeFit(k, A.D[s.id].kind).fit !== 'no').sort((a, b) => (storeFit(a, A.D[s.id].kind).fit === 'native' ? 0 : 1) - (storeFit(b, A.D[s.id].kind).fit === 'native' ? 0 : 1)).map(k => `<button type="button" class="ritem" data-act="d-place-new" data-t="dn" data-id="${esc(s.id)}" data-type="${k}">${svg(SICON[k], 14, 'var(--data)')}<span class="nm">New ${STORES[k].label}</span>${storeFit(k, A.D[s.id].kind).fit === 'works' ? '<span class="tag warn">works</span>' : ''}</button>`).join('')}</div>`;
    return;
  }
  el.innerHTML = `<div><label class="lbl" for="dp-dname" style="display:block">Deploy config</label><input id="dp-dname" class="field" value="${esc(Dp.name)}" data-ch="d-name" style="font-size:17px;font-weight:600;width:100%"></div>
    <div class="note">How the Build runs on real infrastructure. Put workloads on compute and data in stores, across one or more regions. The logic stays the same; speed, cost and failure behavior change.</div>
    <div class="tiles"><div class="tile"><span class="lbl">Regions</span><span class="v">${Dp.regions.length}</span></div><div class="tile"><span class="lbl">Compute</span><span class="v">${Dp.compute.length}</span></div><div class="tile"><span class="lbl">Stores</span><span class="v">${Dp.stores.length}</span></div></div>
    <div class="note">Click anything in the diagram to change it. Problems listed below the diagram block Simulate until they’re fixed; most have a one-click fix.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="ghost sm" data-act="library">${svg(IC.lib, 14)}Save or load a Deploy config</button>${V.valid ? `<button type="button" class="btn sm" data-act="mode" data-m="simulate">Go to Simulate</button>` : ''}</div>`;
}

/* ---------- deploy actions ---------- */
ACT['d-notes'] = () => { ST.dNotes = !ST.dNotes; renderDProbs(); };
ACT['d-view'] = el => { ST.dView = el.dataset.v; render(); };
ACT['d-sel'] = el => { ST.dSel = { t: el.dataset.t, id: el.dataset.id }; if (ST.mode !== 'deploy') { ST.mode = 'deploy'; history.replaceState(null, '', '#deploy'); } render(); };
ACT['d-desel'] = () => { ST.dSel = null; render(); };
ACT['noop'] = () => { };
ACT['d-mapregion'] = el => { const r = el.dataset.id; if (ST.deploy.regions.includes(r)) { ST.dSel = { t: 'r', id: r }; render(); } else { commit((b, d) => { d.regions.push(r); normalizeDeploy(d); }); toast(`Now using ${REGIONS[r].code}. Add compute or stores there.`, { label: 'Undo', fn: undo }); } };
ACT['d-rmregion'] = el => { const r = el.dataset.id; if (ST.deploy.regions.length <= 1) { toast('Keep at least one region'); return; } commit((b, d) => { d.regions = d.regions.filter(x => x !== r); d.compute.forEach(c => c.regions = c.regions.filter(x => x !== r)); d.stores.forEach(s => { s.regions = s.regions.filter(x => x !== r); if (s.primary === r) s.primary = s.regions[0]; }); }); ST.dSel = null; render(); toast(`Stopped using ${REGIONS[r].code}`, { label: 'Undo', fn: undo }); };
CH['d-region'] = el => { const r = el.dataset.r; if (el.checked) commit((b, d) => { d.regions.push(r); normalizeDeploy(d); }); else ACT['d-rmregion']({ dataset: { id: r } }); };
CH['d-peer'] = el => commit((b, d) => { d.peering = el.checked; });
CH['d-name'] = el => commit((b, d) => { d.name = el.value.trim() || 'Untitled deploy'; });
ACT['d-add-c'] = el => { const c = newCompute(ST.deploy, el.dataset.type); commit((b, d) => d.compute.push(c)); ST.dSel = { t: 'c', id: c.id }; render(); };
ACT['d-add-s'] = el => { const s = newStore(ST.deploy, el.dataset.type); commit((b, d) => d.stores.push(s)); ST.dSel = { t: 's', id: s.id }; render(); };
ACT['d-auto'] = () => { commit((b, d) => autoPlace(b, A, d)); toast('Placed everything with defaults', { label: 'Undo', fn: undo }); };
ACT['d-fix'] = el => { const p = ST._dprobs[+el.dataset.i]; if (!p || !p.fix) return; commit((b, d) => p.fix.apply(d)); toast(p.fix.label, { label: 'Undo', fn: undo }); };
ACT['d-cset'] = el => commit((b, d) => { const c = d.compute.find(x => x.id === el.dataset.id); c[el.dataset.k] = el.dataset.v; if (el.dataset.k === 'type') { const T = COMPUTE[c.type]; Object.keys(T.def).forEach(k => { if (c[k] == null || (k === 'size' && T.sizes && !T.sizes[c.size])) c[k] = T.def[k]; }); } });
CH['d-cnum'] = el => commit((b, d) => { const c = d.compute.find(x => x.id === el.dataset.id); c[el.dataset.k] = Math.max(el.dataset.k === 'min' ? 0 : 1, Math.round(Number(el.value) || 0)); if (c.min > c.max) c.max = c.min; });
CH['d-cvpc'] = el => commit((b, d) => { d.compute.find(x => x.id === el.dataset.id).vpc = el.checked; });
CH['d-cname'] = el => commit((b, d) => { d.compute.find(x => x.id === el.dataset.id).name = el.value.trim() || 'compute'; });
ACT['d-creg'] = el => commit((b, d) => { const c = d.compute.find(x => x.id === el.dataset.id); const r = el.dataset.r; c.regions = c.regions.includes(r) ? c.regions.filter(x => x !== r) : c.regions.concat([r]); });
ACT['d-cdel'] = el => { const c = ST.deploy.compute.find(x => x.id === el.dataset.id); commit((b, d) => { d.compute = d.compute.filter(x => x.id !== c.id); }); ST.dSel = null; render(); toast(`Deleted ${c.name}${c.workloads.length ? `. ${c.workloads.length} workload${c.workloads.length > 1 ? 's' : ''} need a new home.` : ''}`, { label: 'Undo', fn: undo }); };
CH['d-mapw'] = el => commit((b, d) => { const w = el.dataset.w; d.compute.forEach(c => c.workloads = c.workloads.filter(x => x !== w)); if (el.checked) d.compute.find(x => x.id === el.dataset.id).workloads.push(w); });
CH['d-sname'] = el => commit((b, d) => { d.stores.find(x => x.id === el.dataset.id).name = el.value.trim() || 'store'; });
CH['d-stype'] = el => commit((b, d) => { const s = d.stores.find(x => x.id === el.dataset.id); s.type = el.value; const T = STORES[s.type]; if (!T.repl.includes(s.repl)) s.repl = T.repl.includes('single') && s.regions.length <= 1 ? 'single' : T.repl[T.repl.length - 1]; if (T.usd && !T.usd[s.size]) s.size = 'Medium'; });
ACT['d-sset'] = el => commit((b, d) => { d.stores.find(x => x.id === el.dataset.id)[el.dataset.k] = el.dataset.v; });
CH['d-sprim'] = el => commit((b, d) => { d.stores.find(x => x.id === el.dataset.id).primary = el.value; });
CH['d-snum'] = el => commit((b, d) => { d.stores.find(x => x.id === el.dataset.id)[el.dataset.k] = Math.min(el.dataset.k === 'shards' ? 64 : 1e4, Math.max(1, Math.round(Number(el.value) || 1))); });
ACT['d-sreg'] = el => commit((b, d) => { const s = d.stores.find(x => x.id === el.dataset.id); const r = el.dataset.r; s.regions = s.regions.includes(r) ? s.regions.filter(x => x !== r) : s.regions.concat([r]); if (!s.regions.includes(s.primary)) s.primary = s.regions[0]; });
ACT['d-sdel'] = el => { const s = ST.deploy.stores.find(x => x.id === el.dataset.id); commit((b, d) => { d.stores = d.stores.filter(x => x.id !== s.id); }); ST.dSel = null; render(); toast(`Deleted ${s.name}`, { label: 'Undo', fn: undo }); };
CH['d-mapd'] = el => commit((b, d) => { const n = el.dataset.d; d.stores.forEach(s => s.data = s.data.filter(x => x !== n)); if (el.checked) d.stores.find(x => x.id === el.dataset.id).data.push(n); });
CH['d-xreg'] = el => commit((b, d) => { d.externals = d.externals || {}; d.externals[el.dataset.id] = { region: el.value }; });
ACT['d-place'] = el => { commit((b, d) => { if (el.dataset.t === 'wl') d.compute.find(x => x.id === el.dataset.to).workloads.push(el.dataset.id); else d.stores.find(x => x.id === el.dataset.to).data.push(el.dataset.id); }); ST.dSel = null; render(); };
ACT['d-place-new'] = el => { let id; commit((b, d) => { if (el.dataset.t === 'wl') { const c = newCompute(d, el.dataset.type); c.workloads.push(el.dataset.id); d.compute.push(c); id = c.id; } else { const s = newStore(d, el.dataset.type); s.data.push(el.dataset.id); d.stores.push(s); id = s.id; } }); ST.dSel = { t: el.dataset.t === 'wl' ? 'c' : 's', id }; render(); };

ACT['d-net'] = el => commit((b, d) => { normalizeDeploy(d); d.network[el.dataset.k] = el.dataset.v; });
ACT['d-rnet'] = el => commit((b, d) => { normalizeDeploy(d); d.network.regions[el.dataset.r][el.dataset.k] = el.dataset.v; });
CH['d-rnetb'] = el => commit((b, d) => { normalizeDeploy(d); d.network.regions[el.dataset.r][el.dataset.k] = el.checked; });
CH['d-rlimit'] = el => commit((b, d) => { normalizeDeploy(d); d.network.regions[el.dataset.r].limit = Math.max(1, Math.round(Number(el.value) || 1)); });
CH['d-pk'] = el => commit((b, d) => { const s = d.stores.find(x => x.id === el.dataset.id); s.dataCfg = s.dataCfg || {}; s.dataCfg[el.dataset.d] = { pk: el.value }; });
ACT['d-wrap'] = el => { ST.dWrap = el.dataset.v === '1'; render(); };
/* ===================== Simulate mode ===================== */
function curScen() { let s = ST.build.scenarios.find(x => x.id === ST.scen); if (!s) { s = ST.build.scenarios.find(x => A.entries.some(e => e.key === x.entry)) || ST.build.scenarios[0]; ST.scen = s ? s.id : null; } return s; }
function scenSig(sc) { return JSON.stringify([ST.build.workloads.map(w => [w.name, w.code, !!w.external]), ST.build.data.map(d => [d.name, d.kind, d.rows, d.rowKB, d.fields]), ST.deploy, sc]); }
function scenPaths(sc) { const e = entryInfo(A, sc.entry); if (!e) return []; return enumeratePaths(A, sc.entry, sc.odds || {}, { fileRows: e.type === 'file' ? (sc.rows || 1) : 1 }); }
function niceStep(x) { if (x <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))); const m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }

function renderSim(v) {
  keepScroll(['s-center', 's-panel', 's-rail'], () => {
    v.innerHTML = `<div class="panes"><aside class="rail" id="s-rail" aria-label="Scenarios and paths"></aside><section class="center scroll" id="s-center"></section><aside class="panel" id="s-panel" aria-label="Scenario"></aside></div>`;
    renderSRail(); renderSCenter(); renderSPanel();
  });
}
function scenStatus(sc) {
  const r = ST.results[sc.id]; if (!r) return '<span class="muted" style="font-size:11.5px">not run</span>';
  if (r.sig !== scenSig(sc)) return '<span class="tag mute">out of date</span>';
  return r.ok ? '<span class="tag good">met</span>' : '<span class="tag bad">missed</span>';
}
function renderSRail() {
  const el = $('#s-rail'); if (!el) return; const sc = curScen();
  const paths = sc && entryInfo(A, sc.entry) ? scenPaths(sc) : [];
  el.innerHTML = `<div class="rsec" data-fb="Scenarios"><div class="hd"><span class="lbl" style="flex:1">Scenarios</span><button type="button" class="iconbtn" data-act="s-add" aria-label="Add scenario" title="Add scenario">${svg(IC.plus, 15)}</button></div>
      ${ST.build.scenarios.map(s => { const e = entryInfo(A, s.entry); return `<button type="button" class="ritem ${sc && s.id === sc.id ? 'on' : ''}" data-act="s-sel" data-id="${s.id}">${svg(e ? TRIG_ICON[e.type] : IC.x, 14, e ? 'var(--muted)' : 'var(--bad)')}<span class="nm">${esc(s.name)}</span>${scenStatus(s)}</button>`; }).join('') || '<div class="muted" style="font-size:12.5px">No scenarios yet.</div>'}</div>
    ${sc && entryInfo(A, sc.entry) ? `<div class="rsec" data-fb="Paths"><div class="hd"><span class="lbl">Paths</span></div><div class="muted" style="font-size:12px;margin-bottom:2px">${paths.length} way${paths.length > 1 ? 's' : ''} through, read from the code. Click one to follow a single request through the infrastructure.</div>
      ${paths.map((p, i) => `<button type="button" class="ritem ${ST.sMode === 'step' && ST.stepR && ST.stepR.scen === sc.id && ST.stepR.i === i ? 'on' : ''}" data-act="s-trace" data-i="${i}" style="align-items:flex-start" title="Step through this path"><span class="num" style="font-size:11.5px;width:42px;flex-shrink:0;padding-top:1px">${(p.p * 100).toFixed(p.p < 0.1 ? 1 : 0)}%</span><span style="flex:1;min-width:0;font-size:12.5px;line-height:1.35">${esc(p.label.charAt(0).toUpperCase() + p.label.slice(1))}</span>${p.outcome === 'error' ? '<span class="tag warn">error</span>' : ''}</button>`).join('')}</div>` : ''}`;
}
function renderSPanel() {
  const el = $('#s-panel'); if (!el) return; const sc = curScen();
  if (!sc) { el.innerHTML = `<div class="note">Add a scenario to describe what happens to the system: a rush of requests, a file landing, a scheduled job.</div><button type="button" class="btn sm" data-act="s-add">Add a scenario</button>`; return; }
  const e = entryInfo(A, sc.entry); const mode = e ? scenarioMode(A, sc) : null;
  const conds = e ? conditionsFor(A, sc.entry) : [];

}
function playPaint() {

document.addEventListener('click', ev => { const c = ev.target.closest && ev.target.closest('#pl-chart'); if (!c || !ST.play) return; const r = c.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * 760; const F = ST.play.T.frames.length; ST.play.f = Math.max(0, Math.min(F - 1, Math.floor((x - 46) / (744 - 46) * F))); ST.play.playing = false; playPaint(); });

/* ---------- step through one request on the infrastructure ---------- */
function stepOpen(i, keepOrigin) {

  else if (load === 'none') { R = {}; loadLabel = 'with no other traffic'; }
  else { M._pc = {}; const r = evaluateRate(M, sc, { N: 200, seed: 3 }); R = r.R; loadLabel = `at the scenario’s load (${fmtRate(r.lambda)}/s)`; }
  M._pc = {}; const S = stepRequest(M, sc, p, origins[oi], R);

const SRCOL = x => ({ net: 'var(--ext)', edge: 'var(--accent)', cpu: 'var(--wl)', data: 'var(--data)', pub: 'var(--msg)', ext: 'var(--ext)', err: 'var(--bad)' })[x] || 'var(--accent)';

      <label class="muted" style="font-size:12.5px;display:flex;gap:6px;align-items:center">Load <select class="field" data-ch="sr-load"><option value="none" ${T.load === 'none' ? 'selected' : ''}>Quiet system</option><option value="avg" ${T.load === 'avg' ? 'selected' : ''}>Scenario load</option>${ST.play && ST.play.scen === sc.id ? `<option value="play" ${T.load === 'play' ? 'selected' : ''}>Playback moment</option>` : ''}</select></label>

}
function stepCard(sc) {

  return `<div class="card" data-fb="Request steps"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px"><h2 style="margin:0">One request: ${esc(T.label.charAt(0).toUpperCase() + T.label.slice(1))}</h2><span class="muted">${esc(T.loadLabel)} · typical timings</span></div>
      ${cur ? `<div class="nowbox"><div style="display:flex;gap:8px;align-items:center"><span class="rdot" style="background:${col(cur.kind)};width:10px;height:10px"></span><b>${esc(cur.label)}</b><span class="num muted">${fmtMs(cur.dur)}</span>${cur.wait > 0.5 ? `<span class="tag warn">${fmtMs(cur.wait)} waiting</span>` : ''}${cur.rho != null && cur.rho > 0 ? `<span class="heat ${heatCls(cur.rho)}">${Math.round(cur.rho * 100)}% busy</span>` : ''}${cur.lane != null ? '<span class="tag mute">in parallel</span>' : ''}</div><div class="note" style="margin-top:4px">${esc(cur.why || '')}</div></div>` : ''}

      <div class="legend" style="padding:6px 0 0"><span><i style="border-color:var(--ext)"></i>network</span><span><i style="border-color:var(--wl)"></i>CPU</span><span><i style="border-color:var(--data)"></i>data</span><span><i style="border-color:var(--msg)"></i>messages</span><span><i class="waitbar" style="border:0;height:8px;width:18px;position:static;display:inline-block"></i>waiting because something is busy</span></div></div>`;

let srT = null;
function stepPaint(animate) {
  const T = ST.stepR; if (!T || ST.sMode !== 'step') return; const cur = T.S.steps[T.k];

}
function stepGo(k, animate) { const T = ST.stepR; if (!T) return; T.k = Math.max(0, Math.min(T.S.steps.length - 1, k)); const box = $('#s-step'); if (box) box.innerHTML = stepCard(curScen()); const bar = $('#sr-bar'); if (bar) bar.innerHTML = stepBar(curScen()); stepPaint(animate); const c = box && box.querySelector('.wfr.cur'); if (c) { const wf = box.querySelector('.wf'); if (wf && (c.offsetTop < wf.scrollTop || c.offsetTop > wf.scrollTop + wf.clientHeight - 30)) wf.scrollTop = c.offsetTop - wf.clientHeight / 2; } }
